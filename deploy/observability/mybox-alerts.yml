groups:
  - name: mybox-sync
    rules:
      - alert: MyBoxApi5xx
        expr: sum(rate(mybox_http_responses_total{status=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: page
          owner: sync-service
        annotations:
          summary: MyBox API is returning 5xx responses
          description: The API has returned 5xx responses continuously for 10 minutes.

      - alert: MyBoxSyncReconcileFailures
        expr: sum(rate(mybox_sync_reconcile_failures_total[10m])) > 0
        for: 15m
        labels:
          severity: ticket
          owner: sync-service
        annotations:
          summary: Sync reconciliation failures are sustained
          description: Reconciliation failures have been observed continuously for 15 minutes.

      - alert: MyBoxSyncCursorResets
        expr: sum(increase(mybox_sync_cursor_resets_total[1h])) > 25
        for: 10m
        labels:
          severity: ticket
          owner: sync-service
        annotations:
          summary: Many clients are requiring full sync resets
          description: Investigate event retention, SSE delivery, and database latency.

      - alert: MyBoxApiRateLimited
        expr: sum(rate(mybox_http_responses_total{status="429"}[10m])) > 1
        for: 15m
        labels:
          severity: ticket
          owner: sync-service
        annotations:
          summary: API rate limiting is sustained
          description: Check abusive clients, account hot spots, and limiter sizing before raising limits.

      - alert: MyBoxReadinessFailures
        expr: increase(mybox_readiness_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: page
          owner: database
        annotations:
          summary: MyBox is failing database-backed readiness checks
          description: Investigate PostgreSQL availability, disk pressure, recovery state, and connection exhaustion.

      - alert: MyBoxAuthFailures
        expr: sum(rate(mybox_api_failures_total{kind=~"auth_.*"}[10m])) > 0
        for: 10m
        labels:
          severity: ticket
          owner: auth
        annotations:
          summary: Local auth failures are sustained
          description: Check signup/signin rate limits, session expiry, and OAuth provider reachability.

      - alert: MyBoxCompactionStalled
        expr: increase(mybox_sync_compaction_runs_total[2h]) == 0
        for: 30m
        labels:
          severity: ticket
          owner: database
        annotations:
          summary: Sync compaction worker has not reported a run
          description: Check the API process, scheduler, PostgreSQL connectivity, and retention logs.
