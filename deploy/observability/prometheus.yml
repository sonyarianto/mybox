global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/mybox-alerts.yml

scrape_configs:
  # Keep this target on the private Compose/management network. The API does
  # not expose metrics through the public Nginx/Cloudflare Tunnel route.
  - job_name: mybox-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["mybox-api:3000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/mybox-metrics-token
